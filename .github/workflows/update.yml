name: Uppfæra veðurgögn

on:
  schedule:
    - cron: "23 7,13 * * *"   # tvisvar á dag (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sækja gögn
        run: python scripts/fetch.py
      - name: Vista data.json
        run: |
          if git diff --quiet -- data.json; then
            echo "Engar breytingar"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Uppfæra veðurgögn"
            git push
          fi
